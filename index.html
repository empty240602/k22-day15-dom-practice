<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));

      @theme {
        --color-surface: #f9fafb;
        --color-foreground: #111827;
        --color-primary: #2563eb;
      }

      @layer theme {
        .dark {
          --color-surface: #030712;
          --color-foreground: #f3f4f6;
          --color-primary: #3b82f6;
        }
      }

      @layer components {
        .active {
          border-color: #3b82f6;
          scale: 1.15;
        }
      }
    </style>
  </head>
  <body
    class="flex justify-center items-center bg-surface min-h-screen text-foreground transition-colors duration-300"
  >
    <div class="space-y-6 text-center">
      <h1 class="font-bold text-4xl tracking-tight">Hello world!</h1>
      <h2>おはようございます　私はミンチョンです</h2>
      <button
        id="theme-toggle"
        class="bg-gray-900 dark:bg-white shadow-md dark:shadow-blue-900/20 px-6 py-3 rounded-lg font-semibold text-white dark:text-gray-900 hover:scale-105 active:scale-95 transition-transform cursor-pointer"
      >
        Toggle Theme
      </button>

      <form class="flex justify-center items-center gap-5">
        <label class="font-semibold text-2xl" for="password">Password: </label>
        <div
          class="flex items-center bg-white border border-gray-300 focus-within:border-blue-500 rounded-lg focus-within:ring-4 focus-within:ring-blue-100 overflow-hidden transition-all duration-200"
        >
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            class="flex-1 bg-transparent px-4 py-3 outline-none min-w-0 text-gray-900 placeholder:text-gray-400 text-sm"
          />
          <button
            type="button"
            id="toggle-password"
            class="flex justify-center items-center hover:bg-gray-100 size-12 text-gray-500 hover:text-blue-600 transition-colors cursor-pointer"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
              id="eye-icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
              />
            </svg>

            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="hidden size-6"
              id="eye-slash-icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
              />
            </svg>
          </button>
        </div>
      </form>

      <div
        class="bg-white shadow-md mx-auto border border-gray-200 rounded-2xl w-full max-w-md"
      >
        <img
          class="rounded-xl w-full object-cover aspect-square"
          id="main-image"
          src="./img/img-2.jpg"
          alt="Shoes-1"
        />
        <div class="flex justify-center gap-3 mt-4 pb-4">
          <img
            class="border-2 hover:border-blue-300 rounded-lg size-20 object-cover transition hover:-translate-y-1 cursor-pointer active thumbnail"
            src="./img/img-2.jpg"
            alt="Shoes-1"
          />
          <img
            class="border-2 hover:border-blue-300 rounded-lg size-20 object-cover transition hover:-translate-y-1 cursor-pointer thumbnail"
            src="./img/img-3.jpg"
            alt="Shoes-2"
          />
          <img
            class="border-2 hover:border-blue-300 rounded-lg size-20 object-cover transition hover:-translate-y-1 cursor-pointer thumbnail"
            src="./img/img-4.jpg"
            alt="Shoes-3"
          />
        </div>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
